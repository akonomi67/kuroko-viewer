<script>
const D={"name": "第1次UWF", "file": "274_編集用", "dur": 909.7833125, "segs": [], "subs": [{"t": 0.0, "x": "1985年9月11日の後楽園ホールに、\n2349人の客が入りました。"}, {"t": 7.35, "x": "超満員の発表です。"}, {"t": 9.05, "x": "リングに立っていたのは、\n藤原喜明とスーパー・タイガーでした。"}, {"t": 13.233333333333333, "x": "団体の名前はUWFです。"}, {"t": 15.666666666666666, "x": "UWFの自主興行は、\nこの夜が最後になりました。"}, {"t": 19.75, "x": "旗揚げからちょうど1年5か月です。"}, {"t": 22.2, "x": "客席が埋まっていても、\n次の大会は開かれませんでした。"}, {"t": 26.3, "x": "この団体には、最後まで無かったものがあります。"}, {"t": 29.7, "x": "毎週決まった時間に流れるテレビ中継です。"}, {"t": 32.7, "x": "旗揚げの34日前、フジテレビは\n放送しないと表明していました。"}, {"t": 37.81666666666667, "x": "テレビ局は、なぜ一度は\n動きかけて、そして降りたのでしょうか？"}, {"t": 42.55, "x": "そして中継を持たない団体は、\nどんな1年5か月を過ごしたのでしょうか？"}, {"t": 47.78333333333333, "x": "今回は、第1次UWFの1年5か月を\nテレビの側から追います。"}, {"t": 53.233333333333334, "x": "当時の記事に残った日付と、\n関係者の言葉をもとに辿っていきます。"}, {"t": 57.916666666666664, "x": "最後までご覧いただければ幸いです。"}, {"t": 60.416666666666664, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 66.0, "x": "話は1983年の夏に始まります。"}, {"t": 69.45, "x": "新日本プロレスでクーデターが起きました。"}, {"t": 72.1, "x": "その責任を取って会社を去ったのが新間寿です。"}, {"t": 75.46666666666667, "x": "新日本の営業本部長だった男です。"}, {"t": 78.38333333333334, "x": "新間が次に動いたのは、新しい団体づくりです。"}, {"t": 82.25, "x": "新日本と全日本に続く、第3の団体でした。"}, {"t": 86.21666666666667, "x": "新日本の中継は、金曜の夜8時でした。"}, {"t": 89.8, "x": "前田日明はその頃の数字をこう振り返っています。"}, {"t": 93.13333333333334, "x": "裏番組には人気のドラマが並んでいた。"}, {"t": 95.78333333333333, "x": "それでもプロレスの視聴率が勝っていた。"}, {"t": 98.25, "x": "そこへ現れたのが、3つ目のテレビ局です。"}, {"t": 101.6, "x": "1984年1月、フジテレビが\nプロレス中継の検討を始めました。"}, {"t": 107.25, "x": "2月の定例会見で、社長はこう認めています。"}, {"t": 110.91666666666667, "x": "プロレス中継をやる方向で検討している。"}, {"t": 113.75, "x": "枠の候補もありました。"}, {"t": 115.33333333333333, "x": "毎週水曜の夜8時です。"}, {"t": 117.35, "x": "そこでは人気の時代劇が18年続いていました。"}, {"t": 120.71666666666667, "x": "その放送が4月4日で終わると決まっていました。"}, {"t": 123.81666666666666, "x": "翌週からの番組が、スポーツ・スクランブルです。"}, {"t": 127.2, "x": "第1回の中身の候補に\nプロレスが挙がっていました。"}, {"t": 130.5, "x": "第1回の日付は4月11日でした。"}, {"t": 133.43333333333334, "x": "この日付はあとでもう1度出てきます。"}, {"t": 135.75, "x": "2月5日、新間はニューヨークへ\n向かう前に取材を受けました。"}, {"t": 140.15, "x": "相手は東京スポーツです。"}, {"t": 142.0, "x": "団体を作る理由を、新間はこう言い切りました。"}, {"t": 145.6, "x": "団体設立を決めたのは猪木のため。"}, {"t": 148.13333333333333, "x": "猪木が燃える舞台を作ってやりたい。"}, {"t": 150.43333333333334, "x": "この話は2月8日の紙面の1面に載りました。"}, {"t": 153.66666666666666, "x": "現場の選手は、別の説明を聞いていました。"}, {"t": 157.06666666666666, "x": "前田が語る話はこうです。"}, {"t": 159.11666666666667, "x": "新日本の放映権を持つのはテレビ朝日でした。"}, {"t": 162.36666666666667, "x": "そこへフジテレビを加えて、2局で流します。"}, {"t": 165.7, "x": "放映権の料金を倍にする策だったというのです。"}, {"t": 168.93333333333334, "x": "ただし契約書にはテレビ朝日の\n独占の文言がありました。"}, {"t": 172.63333333333333, "x": "そこで別の団体を、子会社のように\n作ったと前田は語っています。"}, {"t": 177.26666666666668, "x": "これは前田の回想です。"}, {"t": 179.03333333333333, "x": "フジテレビの側の記録で\n確かめられた話ではありません。"}, {"t": 182.53333333333333, "x": "当時は、行けと\n言われたら行くしかなかったとも話しています。"}, {"t": 186.36666666666667, "x": "2月9日、大阪の新日本の会場で騒ぎが起きます。"}, {"t": 190.7, "x": "その日に出た専門誌に記事が載っていました。"}, {"t": 193.43333333333334, "x": "長州力と佐山聡が、フジテレビの\n第3団体と契約済みだという内容です。"}, {"t": 199.06666666666666, "x": "佐山は初代タイガーマスクとして人気を\n集めた男です。"}, {"t": 202.71666666666667, "x": "この写真は、その日の大阪で撮られました。"}, {"t": 205.88333333333333, "x": "長州は報道陣の前で、\n雑誌を真っ二つに裂いています。"}, {"t": 210.18333333333334, "x": "どうして、こんなデタラメな記事ばかり出るんだ。"}, {"t": 213.18333333333334, "x": "長州はそう語り、雑誌社の\n告訴も辞さないと述べました。"}, {"t": 217.38333333333333, "x": "当時の関係者はこんな話も残しています。"}, {"t": 220.28333333333333, "x": "長州の前に小切手千五百万円が置かれました。"}, {"t": 223.61666666666667, "x": "現金も二千五百万円から\n三千万円積まれたといいます。"}, {"t": 227.6, "x": "長州はそれを断ったという話です。"}, {"t": 230.21666666666667, "x": "テレビ朝日も動きました。"}, {"t": 231.93333333333334, "x": "新日本との契約とは別に、\n選手と専属の契約を結んだのです。"}, {"t": 236.93333333333334, "x": "それまで専属は猪木と坂口征二だけでした。"}, {"t": 239.95, "x": "それが全選手に広がりました。"}, {"t": 242.08333333333334, "x": "同じ関係者によると、\nレフェリーでも300万円でした。"}, {"t": 246.03333333333333, "x": "若手でも六十万円から七十万円です。"}, {"t": 248.96666666666667, "x": "1984年3月8日は、\n新しい団体が事務所を開く日でした。"}, {"t": 254.56666666666666, "x": "名前はユニバーサル・レスリング連盟、\n略してUWFです。"}, {"t": 259.43333333333334, "x": "その場に知らせが飛び込みました。"}, {"t": 261.46666666666664, "x": "フジテレビの広報部長が、\n放送しないと表明したのです。"}, {"t": 265.65, "x": "広報部長の説明が残っています。"}, {"t": 268.1333333333333, "x": "相手方との交渉過程の中で、\n出場選手と相手方の対応に不安があった。"}, {"t": 273.73333333333335, "x": "少しでも不安があっては放送に踏み切れない。"}, {"t": 276.6666666666667, "x": "放送計画は取りやめた。"}, {"t": 278.48333333333335, "x": "番組を作るとみられていたのは、\nフジの子会社の共同テレビです。"}, {"t": 282.98333333333335, "x": "その関係者が経緯をこう明かしています。"}, {"t": 285.6, "x": "フジに出された選手の\n一覧は、ものすごいものだった。"}, {"t": 289.3, "x": "猪木から長州、佐山、前田などが並んでいた。"}, {"t": 293.51666666666665, "x": "フジは乗り気だった。"}, {"t": 294.85, "x": "しかし企画書は企画書だけで終わった。"}, {"t": 297.23333333333335, "x": "テレビ朝日も企業防衛に出て、\n選手の引き留めに本気になった。"}, {"t": 301.65, "x": "前田の見方は少し違います。"}, {"t": 303.71666666666664, "x": "猪木の事業の借金が\n問題になっていたというのです。"}, {"t": 307.01666666666665, "x": "テレ朝以外のテレビ局は、\nどこも手を出したがらなかった。"}, {"t": 310.8666666666667, "x": "その問題さえなかったら、フジテレビは\nユニバーサルの放送をやっていたと思う。"}, {"t": 315.98333333333335, "x": "前田はそう語っています。"}, {"t": 317.75, "x": "理由は1つに決まっていません。"}, {"t": 319.8333333333333, "x": "決まっているのは日付です。"}, {"t": 321.53333333333336, "x": "3月8日、中継の話は消えました。"}, {"t": 324.8, "x": "1984年4月11日、\n埼玉県の大宮スケートセンター。"}, {"t": 330.53333333333336, "x": "UWFの旗揚げ戦です。"}, {"t": 332.78333333333336, "x": "先ほどの、水曜夜8時の\n新番組の第1回と同じ日でした。"}, {"t": 337.56666666666666, "x": "その枠に、UWFの名前はありません。"}, {"t": 340.9166666666667, "x": "前田はこの日から、\nリングネームを本名に変えています。"}, {"t": 344.68333333333334, "x": "ポスターには猪木の写真が入っていました。"}, {"t": 347.26666666666665, "x": "前田は、猪木が来ると思っていたと語っています。"}, {"t": 350.76666666666665, "x": "新間も強気でした。"}, {"t": 352.28333333333336, "x": "フジとは今も交渉中なんだ。"}, {"t": 354.3333333333333, "x": "前田は、新間のこの言葉を覚えています。"}, {"t": 357.46666666666664, "x": "猪木が来ないと分かったのは、\n当日に会場へ着いてからでした。"}, {"t": 361.65, "x": "客席からは猪木コールが起こります。"}, {"t": 364.01666666666665, "x": "長州コールも藤波コールも起こりました。"}, {"t": 366.71666666666664, "x": "どれもその日の試合に出ていない選手の名前です。"}, {"t": 369.76666666666665, "x": "メインイベントで、\n前田はアメリカの選手に勝ちました。"}, {"t": 373.55, "x": "決め技はジャーマンスープレックスです。"}, {"t": 375.93333333333334, "x": "試合のあとはこう叫んでいます。"}, {"t": 378.1666666666667, "x": "俺は、今までの俺とは違う。"}, {"t": 380.6333333333333, "x": "ファンに媚びるプロレスはやらない。"}, {"t": 382.56666666666666, "x": "新間は次の約束を口にしました。"}, {"t": 385.1166666666667, "x": "最終戦の蔵前国技館には来るから。"}, {"t": 387.8666666666667, "x": "4月17日の蔵前でも、UWFの\nリングに猪木は上がっていません。"}, {"t": 393.2, "x": "その後、高田延彦を通じて前田に伝言が届きます。"}, {"t": 397.18333333333334, "x": "前田、帰ってこい。"}, {"t": 399.18333333333334, "x": "猪木からの伝言でした。"}, {"t": 400.81666666666666, "x": "前田は戻りませんでした。"}, {"t": 402.55, "x": "一緒に来た社員を\n見捨てて戻れなかったと語っています。"}, {"t": 405.9, "x": "興行の現実についてはこう話しています。"}, {"t": 408.75, "x": "猪木さんが来ないってわかると、\nプロモーターも興行を買ってくれない。"}, {"t": 413.01666666666665, "x": "立て直しは人でした。"}, {"t": 414.55, "x": "6月27日、藤原と高田が入団を発表します。"}, {"t": 419.0, "x": "7月23日の後楽園には、\n佐山がザ・タイガーとして上がりました。"}, {"t": 424.0833333333333, "x": "354日ぶりの復帰でした。"}, {"t": 426.73333333333335, "x": "8月6日に正式に入団しています。"}, {"t": 429.45, "x": "9月には木戸修も加わりました。"}, {"t": 431.71666666666664, "x": "新間は、のちにUWFを退陣しています。"}, {"t": 435.31666666666666, "x": "12月5日の後楽園では、\n佐山と藤原が特別なルールで闘いました。"}, {"t": 440.73333333333335, "x": "フォールの無い試合です。"}, {"t": 442.26666666666665, "x": "蹴りを重ねた佐山のKO勝ちでした。"}, {"t": 444.78333333333336, "x": "前田はその頃をこう語っています。"}, {"t": 447.1, "x": "東京ではブームが起きかかった。"}, {"t": 449.15, "x": "でも地方は散々。"}, {"t": 450.65, "x": "地方で差が出た理由を、\nスポルティーバの連載が書いています。"}, {"t": 454.78333333333336, "x": "新日本と全日本の選手は、\nテレビ中継で全国に顔が知られていました。"}, {"t": 460.1666666666667, "x": "UWFの選手にはそれがありません。"}, {"t": 462.98333333333335, "x": "地方大会では、客を思うように\n集められませんでした。"}, {"t": 466.98333333333335, "x": "ファンの側にも記録があります。"}, {"t": 468.96666666666664, "x": "ノンフィクションの本である1984年の\nUWFは、北海道の中学生の話から始まります。"}, {"t": 476.31666666666666, "x": "UWFはテレビで放映されていない。"}, {"t": 479.0833333333333, "x": "だから映像を見たことは一度もない。"}, {"t": 481.31666666666666, "x": "その中学生は、雑誌の写真で技を\n覚えて試したと書かれています。"}, {"t": 486.25, "x": "もう1つの手段はビデオでした。"}, {"t": 488.3333333333333, "x": "UWFの映像は、クエストという会社が\nビデオで残していました。"}, {"t": 493.06666666666666, "x": "1984年12月5日の試合などを\n収めた1本は、1985年に発売されています。"}, {"t": 500.78333333333336, "x": "1984年の秋には団体の\n周りで悪い知らせが続きます。"}, {"t": 505.43333333333334, "x": "10月1日、選手の食を支えていた肉店の\n人が道場で倒れて亡くなりました。"}, {"t": 511.1333333333333, "x": "10月5日には、旗揚げの仲間だった\nラッシャー木村と剛竜馬が抜けました。"}, {"t": 516.1, "x": "10月19日には、UWFの社長が逮捕されます。"}, {"t": 520.4, "x": "東京スポーツの記事によると、容疑は強要でした。"}, {"t": 524.1166666666667, "x": "佐山の入団をめぐる件です。"}, {"t": 526.35, "x": "佐山は社長の無実を語りました。"}, {"t": 528.75, "x": "この件の結末は、今回の\n資料では確かめられていません。"}, {"t": 532.95, "x": "ここに1枚の写真があります。"}, {"t": 535.0166666666667, "x": "翌日の10月20日、島根県の\n松江の駅で撮られたものです。"}, {"t": 539.5666666666667, "x": "選手たちが新聞を広げてのぞき込んでいます。"}, {"t": 542.5833333333334, "x": "10月25日、福島で\nシリーズを終えた前田はこう語りました。"}, {"t": 547.4333333333333, "x": "俺たちはUWFと心中する。"}, {"t": 549.9166666666666, "x": "ここがダメになったときは引退だ。"}, {"t": 552.0333333333333, "x": "お金も尽きかけていました。"}, {"t": 553.6666666666666, "x": "前田の言葉では、会社は火の車です。"}, {"t": 556.7666666666667, "x": "選手にはギャラが出ました。"}, {"t": 558.4833333333333, "x": "社員の給料は遅れていました。"}, {"t": 560.7666666666667, "x": "12月26日の後楽園では、\nファンに向けた催しが開かれます。"}, {"t": 565.7333333333333, "x": "オークションの最高値は、\n前田の愛用品の3点セットでした。"}, {"t": 570.15, "x": "2万5千円です。"}, {"t": 571.6333333333333, "x": "これでUWFもやっと年が越せます。"}, {"t": 574.3666666666667, "x": "前田の冗談です。"}, {"t": 575.7666666666667, "x": "それでも経営の悪化は事実でした。"}, {"t": 578.2166666666667, "x": "1985年、救いの手が現れます。"}, {"t": 582.0833333333334, "x": "海外タイムスという新聞社が\nスポンサーに付きました。"}, {"t": 585.3833333333333, "x": "3月15日からは、初めての\n海外キャンプをグアムで開いています。"}, {"t": 590.2333333333333, "x": "この写真は、そのグアムで\n3月17日に撮られたものです。"}, {"t": 594.6, "x": "5月には社名を海外UWFに変えました。"}, {"t": 597.9166666666666, "x": "事務所は赤坂に移ります。"}, {"t": 599.8333333333334, "x": "遅れていた社員の給料も\n払われるようになりました。"}, {"t": 603.1, "x": "テレビもようやく動きました。"}, {"t": 604.85, "x": "テレビ東京の世界のプロレスです。"}, {"t": 607.1, "x": "海外の試合を中心に流す番組でした。"}, {"t": 610.1166666666667, "x": "そこにUWFの試合が入ります。"}, {"t": 612.8, "x": "5月18日の下関と、\n5月31日の後楽園の試合です。"}, {"t": 618.2, "x": "ただし毎週の中継ではありません。"}, {"t": 620.55, "x": "この番組でUWFが流れたのは、 333333333, "x": "初めて見た方は、よければ\nチャンネル登録をして次の回もご覧ください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;

  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
