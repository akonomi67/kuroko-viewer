<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>確認用ビューア</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media(prefers-color-scheme:dark){:root{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;
  --dim:#9b948d;--line:#33303a;--accent:#e0705a}}
body{background:var(--bg);color:var(--ink);margin:0;
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:40px 20px}
h1{font-size:18px;font-weight:600;letter-spacing:.02em;margin:0 0 4px}
p{color:var(--dim);font-size:13.5px;margin:0 0 22px}
ul{list-style:none;padding:0;margin:0;border:1px solid var(--line);
  border-radius:10px;overflow:hidden;background:var(--panel)}
li+li{border-top:1px solid var(--line)}
a{display:flex;gap:14px;padding:13px 16px;color:var(--accent);text-decoration:none;font-weight:500}
a b{color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums;min-width:3em}
.none{display:block;padding:13px 16px;color:var(--dim)}
a:hover{background:rgba(127,127,127,.07)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
</style>
<div class="wrap"><h1>確認用ビューア</h1>
<p>音に合わせて絵と字幕が切り替わります。スマホ・タブレットでも見られます。</p>
<ul><li><a href="203/"><b>203</b>巌流島</a></li></ul></div>
