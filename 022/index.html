<script>
const D={"name": "職場で信用を落とす小さな行動ワースト10", "file": "022_職場で信用を落とす小さな行動ワースト10", "dur": 1067.16665625, "segs": [], "subs": [{"t": 0.0, "x": "信用は、大きな失敗より小さな行動で\n少しずつ減っていくと言われます。"}, {"t": 5.2, "x": "今日は職場で信用を落としやすい行動を\n取り上げます。"}, {"t": 8.75, "x": "順番は十位からです。"}, {"t": 10.466666666666667, "x": "一位はほとんどの人が一度はやっています。"}, {"t": 13.25, "x": "やっているのに、やった本人は\nたいてい覚えていません。"}, {"t": 17.116666666666667, "x": "覚えていないのは、その場では\n何も起きないからです。"}, {"t": 20.55, "x": "何も起きないので叱られることもありません。"}, {"t": 23.133333333333333, "x": "謝ることもありません。"}, {"t": 24.7, "x": "ありませんが、見ていた側の\n中では小さく目盛りが動きます。"}, {"t": 28.866666666666667, "x": "動いた目盛りは、本人の目に\n映らないところで積もります。"}, {"t": 32.7, "x": "積もった分は、ある日まとめて形になります。"}, {"t": 35.833333333333336, "x": "そして本人に返ってきます。"}, {"t": 37.85, "x": "大事な仕事を任せる時に名前が挙がらない。"}, {"t": 40.75, "x": "そういう形です。"}, {"t": 42.15, "x": "挙がらない理由を聞いてみます。"}, {"t": 44.083333333333336, "x": "はっきりした答えは出てきません。"}, {"t": 46.15, "x": "出てこないのは、一つ一つが\n小さすぎて言葉にしにくいからです。"}, {"t": 50.416666666666664, "x": "今日の十個はどれもその小さすぎる側の行動です。"}, {"t": 53.8, "x": "ひとつずつは、注意するほどのことではないと\n思われがちです。"}, {"t": 57.8, "x": "思われがちなものほど繰り返されます。"}, {"t": 60.13333333333333, "x": "繰り返されるうちに重くなりやすいです。"}, {"t": 62.61666666666667, "x": "重さを量るために二人を並べます。"}, {"t": 64.95, "x": "得をする人と損をする人です。"}, {"t": 67.15, "x": "得をする人は、小さな約束ほど\nその日のうちに閉じています。"}, {"t": 71.36666666666666, "x": "損をする人は、大きな仕事で\n取り返せると考えがちです。"}, {"t": 75.6, "x": "考え方の差は普段の動きの中では\n見分けがつきません。"}, {"t": 79.16666666666667, "x": "つかないまま半年ほどたちます。"}, {"t": 81.25, "x": "そのころ信用の残高に差が出てきます。"}, {"t": 83.9, "x": "では、十位から順に上がっていきます。"}, {"t": 86.7, "x": "まずは第十位です。"}, {"t": 88.16666666666667, "x": "週の初めの定例会議が始まります。"}, {"t": 90.78333333333333, "x": "開始の時刻に席がひとつ空いています。"}, {"t": 93.26666666666667, "x": "空いた席の人は、一分ほどして\n小走りで入ってきます。"}, {"t": 97.03333333333333, "x": "入ってきた人はすみませんと頭を下げます。"}, {"t": 99.88333333333334, "x": "そして席に座ります。"}, {"t": 101.5, "x": "座ったあとは、何事もなかったように議題が進みます。"}, {"t": 105.35, "x": "議題は進んでいます。"}, {"t": 106.96666666666667, "x": "遅れはなかったことになりそうです。"}, {"t": 109.1, "x": "ところが、これが毎回となると話が変わってきます。"}, {"t": 112.61666666666666, "x": "変わるのは、\n遅れた一分の長さのほうではありません。"}, {"t": 116.3, "x": "毎回そうなる人だという、見られ方のほうです。"}, {"t": 119.7, "x": "見られ方は、会議の中身とは\n関係なく決まっていきます。"}, {"t": 123.65, "x": "損をする人は、一分なら誰の\n迷惑にもならないと考えやすいです。"}, {"t": 128.48333333333332, "x": "実際、その一分で会議が止まることは\nほとんどありません。"}, {"t": 132.55, "x": "止まらないからこそ誰も口に出して指摘しません。"}, {"t": 135.48333333333332, "x": "指摘はされません。"}, {"t": 136.81666666666666, "x": "本人の中では問題がないままです。"}, {"t": 139.31666666666666, "x": "得をする人は、開始の一分前には\n席に着いていることが多いです。"}, {"t": 143.98333333333332, "x": "早く来て何か\n特別なことをしているわけでもありません。"}, {"t": 147.41666666666666, "x": "資料を開いて待っています。"}, {"t": 149.3, "x": "それだけです。"}, {"t": 150.36666666666667, "x": "ただ、待っている姿は周りの目によく残ります。"}, {"t": 153.91666666666666, "x": "残った姿は、この人は時間を\n守るという印象に変わります。"}, {"t": 158.2, "x": "変わった印象は、ある場面で効いてきます。"}, {"t": 161.35, "x": "締切のある仕事を誰に頼むかの場面です。"}, {"t": 164.36666666666667, "x": "会議の一分は、締切の一日と\n同じ物差しで見られやすいです。"}, {"t": 169.03333333333333, "x": "ここではこの目減りを一分の利子と呼んでおきます。"}, {"t": 172.06666666666666, "x": "一回ごとの額は小さいです。"}, {"t": 174.25, "x": "でも毎週つくと残高が減っていきます。"}, {"t": 176.85, "x": "続いて第九位です。"}, {"t": 178.41666666666666, "x": "共有の棚から、穴あけパンチや\n延長コードを借りることがあります。"}, {"t": 182.91666666666666, "x": "借りること自体は毎日のように起きています。"}, {"t": 185.61666666666667, "x": "どの職場でも同じです。"}, {"t": 187.25, "x": "起きるたびに、戻す場所もだいたい\n決まっているはずです。"}, {"t": 190.83333333333334, "x": "はずの場所に、物が戻っていない日があります。"}, {"t": 193.95, "x": "戻っていない物はどこかで見つかります。"}, {"t": 196.41666666666666, "x": "借りた人の机の端や、別の棚です。"}, {"t": 199.48333333333332, "x": "見つかれば済む話です。"}, {"t": 201.2, "x": "たいていは誰も責めません。"}, {"t": 202.91666666666666, "x": "責めませんが、探した人は誰が\n使ったかを覚えています。"}, {"t": 206.95, "x": "覚えている名前が毎回同じこともあります。"}, {"t": 209.71666666666667, "x": "すると小さな印がつき始めます。"}, {"t": 212.13333333333333, "x": "損をする人は、使った場所の\n近くに置けば同じだと考えがちです。"}, {"t": 216.73333333333332, "x": "本人にとっては、すぐ手の届く\n所に戻したつもりでいます。"}, {"t": 220.85, "x": "つもりと実際の場所はずれています。"}, {"t": 223.16666666666666, "x": "そのずれは次に使う人だけが知ることになります。"}, {"t": 226.21666666666667, "x": "知った人がわざわざ言いに来ることは\nほとんどありません。"}, {"t": 229.53333333333333, "x": "得をする人は、借りた時の場所にそのまま戻します。"}, {"t": 233.15, "x": "戻す時に、残りが少なければそれも伝えておきます。"}, {"t": 236.9, "x": "伝えるのは、替えの芯や電池が\nもうすぐ切れるという程度です。"}, {"t": 241.05, "x": "程度は小さなことです。"}, {"t": 242.73333333333332, "x": "それでも見ている人には丁寧さとして映ります。"}, {"t": 245.73333333333332, "x": "映った丁寧さは物の扱いだけで終わりません。"}, {"t": 248.85, "x": "大事な書類や数字も、同じように見られます。"}, {"t": 252.01666666666668, "x": "この人なら雑に扱わないと思われます。"}, {"t": 254.73333333333332, "x": "思われるかどうかは、備品の戻し方で\n先に決まっていることがあります。"}, {"t": 259.3, "x": "物を戻す場所は、その人の仕事の\n締まり方として見られやすいです。"}, {"t": 263.8333333333333, "x": "ここではこの見られ方を棚の履歴と呼んでおきます。"}, {"t": 266.98333333333335, "x": "第八位は、電話の伝言です。"}, {"t": 269.56666666666666, "x": "席を外している人あてに、電話が\nかかってくることがあります。"}, {"t": 273.6666666666667, "x": "受けた人はメモを書きます。"}, {"t": 275.3666666666667, "x": "そして相手の机に置いておきます。"}, {"t": 277.7, "x": "置かれたメモには、折り返しを\nお願いしますとだけあります。"}, {"t": 281.55, "x": "誰からなのかはどこにも書かれていません。"}, {"t": 284.05, "x": "書いた本人は聞けば分かると思っています。"}, {"t": 286.8, "x": "そういうことが多いです。"}, {"t": 288.5, "x": "多いのですが、戻った人はまず相手を\n探すところから始めます。"}, {"t": 292.93333333333334, "x": "探してみると、受けた人は会議に入っています。"}, {"t": 296.3666666666667, "x": "なかなかつかまりません。"}, {"t": 297.8833333333333, "x": "つかまらない間、折り返しは止まったままになります。"}, {"t": 301.5, "x": "止まった折り返しは、遅れになります。"}, {"t": 304.21666666666664, "x": "電話をかけてきた相手の中での遅れです。"}, {"t": 306.8666666666667, "x": "遅れの理由は、かけてきた相手には\nまず伝わりません。"}, {"t": 310.46666666666664, "x": "損をする人は、伝言を渡した時点で\n役目は終わったと考えやすいです。"}, {"t": 315.53333333333336, "x": "渡したのは確かです。"}, {"t": 317.0833333333333, "x": "本人に悪気はまったくありません。"}, {"t": 319.3666666666667, "x": "ありませんが、受け取った側は\n手間をひとつ増やされています。"}, {"t": 323.35, "x": "得をする人の伝言は違います。"}, {"t": 325.6666666666667, "x": "名前と会社名と用件の三つがそろっています。"}, {"t": 328.9166666666667, "x": "そろえるのに余計にかかる時間は十秒ほどです。"}, {"t": 332.06666666666666, "x": "十秒で、受け取った人は迷わず折り返しができます。"}, {"t": 335.98333333333335, "x": "折り返しが早くできます。"}, {"t": 337.75, "x": "その早さは、伝言を受けた人の評判にも\nつながります。"}, {"t": 341.75, "x": "つながるのは、この人の伝言なら\n確かめずに動けるからです。"}, {"t": 345.8, "x": "確かめずに動ける相手は、職場では\nそう多くありません。"}, {"t": 349.7, "x": "伝言の質は、ひとつの下見になります。"}, {"t": 352.6333333333333, "x": "次の大事な連絡を任せられるかの下見です。"}, {"t": 355.6, "x": "第七位は、共有の予定表です。"}, {"t": 358.43333333333334, "x": "チームの全員が同じ予定表を使っています。"}, {"t": 361.48333333333335, "x": "外出や休みをそこに書き込みます。"}, {"t": 363.9, "x": "書き込みがそろっていると、\n打ち合わせの日程はすぐ決まります。"}, {"t": 368.01666666666665, "x": "ところが、一人だけ予定が古いままのことがあります。"}, {"t": 371.53333333333336, "x": "誰かが古いままの予定表を見ます。"}, {"t": 374.0, "x": "そして空いている時間に打ち合わせを入れます。"}, {"t": 376.73333333333335, "x": "入れたあとでその時間は外出だったと分かります。"}, {"t": 379.7, "x": "分かった時点でやり直しです。"}, {"t": 381.65, "x": "全員の日程をもう一度合わせ直すことになります。"}, {"t": 384.95, "x": "合わせ直す手間は、予定を組んだ人に回ってきます。"}, {"t": 388.56666666666666, "x": "回ってきた人はやり方を変えます。"}, {"t": 390.81666666666666, "x": "次からその人にだけ直接確かめるようになります。"}, {"t": 394.0, "x": "確かめる相手が増えるほど、\n予定表の意味が薄れます。"}, {"t": 397.8833333333333, "x": "損をする人は、自分の予定は頭に\n入っているから困らないと考えがちです。"}, {"t": 403.21666666666664, "x": "自分は困りません。"}, {"t": 404.6666666666667, "x": "だから書き込むのが後回しになります。"}, {"t": 407.06666666666666, "x": "後回しになった分だけ周りが\n確かめる手間を背負っています。"}, {"t": 410.76666666666665, "x": "得をする人は、予定が決まるとすぐ動きます。"}, {"t": 414.1333333333333, "x": "その場で予定表を直しています。"}, {"t": 416.3666666666667, "x": "直すのは、電話を切った直後や\n打ち合わせの終わりの数秒です。"}, {"t": 420.71666666666664, "x": "書き込みは数秒です。"}, {"t": 422.31666666666666, "x": "それで周りは本人に聞かずにスケジュールを組めます。"}, {"t": 425.55, "x": "組めることは、この人は周りの時間も\n考えているという印象になります。"}, {"t": 430.3, "x": "印象としては地味です。"}, {"t": 431.98333333333335, "x": "でもチームで動く仕事ほど重く見られます。"}, {"t": 434.71666666666664, "x": "重く見られるのは、一人の更新漏れが\n全員の予定を動かすからです。"}, {"t": 439.28333333333336, "x": "予定表に書かれていない予定は、\n周りにとっては無いのと同じです。"}, {"t": 443.75, "x": "無いものとして扱われた予定はずれを生みます。"}, {"t": 446.68333333333334, "x": "そのずれは本人の信用で埋め合わせることになります。"}, {"t": 450.1166666666667, "x": "第六位は、朝礼のあとに起きることです。"}, {"t": 453.1333333333333, "x": "朝礼で連絡がありました。"}, {"t": 455.0, "x": "午後から会議室が使えなくなるという内容です。"}, {"t": 458.1166666666667, "x": "全員が同じ場所で同じ連絡を聞いていたはずです。"}, {"t": 461.48333333333335, "x": "はずなのに、昼過ぎに一人が\nそれを隣の人にたずねます。"}, {"t": 465.31666666666666, "x": "たずねられた人は、もう一度最初から説明します。"}, {"t": 468.93333333333334, "x": "説明すること自体は、数十秒で終わる\n小さな手間です。"}, {"t": 473.05, "x": "手間は小さなものです。"}, {"t": 474.6333333333333, "x": "でもこれが何度か続くと見られ方が変わります。"}, {"t": 477.51666666666665, "x": "変わった見られ方は、話を聞いていない\n人という形をとります。"}, {"t": 481.8, "x": "本当に聞いていなかったのかは、\n周りには分かりません。"}, {"t": 485.46666666666664, "x": "分からないままです。"}, {"t": 486.81666666666666, "x": "そこで、いちばん分かりやすい説明が選ばれます。"}, {"t": 490.3666666666667, "x": "損をする人は、聞き直すのは\n確実にするためだと考えています。"}, {"t": 494.9166666666667, "x": "考え方としては筋が通っています。"}, {"t": 497.43333333333334, "x": "間違えるよりはずっといいはずです。"}, {"t": 499.6166666666667, "x": "ただ、相手と時間は選ぶ必要があります。"}, {"t": 502.76666666666665, "x": "選ばないと印象だけが残ります。"}, {"t": 504.96666666666664, "x": "得をする人は、朝礼の連絡を短くメモに残しています。"}, {"t": 509.1666666666667, "x": "メモを見ても迷う時があります。"}, {"t": 511.23333333333335, "x": "その時は聞き直す前に前置きを入れます。"}, {"t": 514.0833333333334, "x": "入れるのは、朝の件で一点だけ\n確かめさせてくださいという形です。"}, {"t": 518.6166666666667, "x": "この形だと朝の連絡を覚えていることが\n先に伝わります。"}, {"t": 522.4333333333333, "x": "伝わったうえでの質問は、確認として\n受け取られやすいです。"}, {"t": 526.6333333333333, "x": "同じ質問でも受け取り方は分かれます。"}, {"t": 529.2166666666667, "x": "前置きがあるかないかの差です。"}, {"t": 531.2166666666667, "x": "その差は、あとで響きます。"}, {"t": 533.4, "x": "次の大事な連絡を誰に先に回すかです。"}, {"t": 536.3666666666667, "x": "朝礼の連絡は、その日のうちに\n聞く力を試される場面でもあります。"}, {"t": 541.15, "x": "ここではこの目減りを聞き直しの\n二重払いと呼んでおきます。"}, {"t": 544.75, "x": "第五位は、メールの宛先です。"}, {"t": 547.2333333333333, "x": "何人かで進めている仕事があります。"}, {"t": 549.7333333333333, "x": "決まったことをメールで送ります。"}, {"t": 551.7166666666667, "x": "送る時に、なぜか関係者が一人だけ\n宛先から抜けています。"}, {"t": 556.0166666666667, "x": "抜けた理由は、単に入れ忘れたというだけのことが\n多いです。"}, {"t": 560.0666666666667, "x": "多いのですが、抜かれた側は\nそう受け取らないことがあります。"}, {"t": 563.8833333333333, "x": "受け取り方の一つは、自分は\n外されたのではないかという疑いです。"}, {"t": 568.4333333333333, "x": "疑いは、あとから転送された\nメールを読んだ時に生まれます。"}, {"t": 572.4666666666667, "x": "生まれた疑いが、送った人に\n直接ぶつけられることはまずありません。"}, {"t": 576.9333333333333, "x": "ありませんが、次のやり取りから\n少しずつ距離が出てきます。"}, {"t": 580.8, "x": "距離が出ると、情報が回ってくるのも遅くなります。"}, {"t": 584.3333333333334, "x": "損をする人は、あとで転送すれば\n同じだと考えやすいです。"}, {"t": 588.7, "x": "中身さえ届けばいいと思っています。"}, {"t": 591.0833333333334, "x": "届く順番は気にしないだろうという考えです。"}, {"t": 594.0166666666667, "x": "思っているほど、人は届いた順番を軽く見ていません。"}, {"t": 597.7666666666667, "x": "得をする人は、送る前に宛先の\n顔ぶれを一度だけ見直します。"}, {"t": 602.3833333333333, "x": "見直す時の基準はひとつです。"}, {"t": 604.4833333333333, "x": "この件で困る人が全員入っているかどうかです。"}, {"t": 607.6333333333333, "x": "迷った時は、外すより入れておくほうを\n選ぶことが多いです。"}, {"t": 611.7333333333333, "x": "入れておけば済むからです。"}, {"t": 613.3833333333333, "x": "受け取った側が不要なら、読み流せばいいだけです。"}, {"t": 616.9666666666667, "x": "済む話を、外された側の気持ちの\n問題にしないための選び方です。"}, {"t": 621.6666666666666, "x": "宛先は、誰を仲間として数えているかが\n表に出る場所です。"}, {"t": 626.0, "x": "出てしまった数え方は長く覚えられます。"}, {"t": 628.75, "x": "本人が思うよりずっと長いことがあります。"}, {"t": 631.5666666666667, "x": "第四位からは、言葉にまつわる行動に入ります。"}, {"t": 635.1333333333333, "x": "昼休みの休憩室での話です。"}, {"t": 637.6333333333333, "x": "ほかの部署の失敗が話題になります。"}, {"t": 640.05, "x": "話している人に責めるつもりはないことが多いです。"}, {"t": 643.15, "x": "ちょっとした笑い話のつもりでいます。"}, {"t": 645.5, "x": "場を和ませるためです。"}, {"t": 647.05, "x": "聞いている側も、その時は一緒に笑っています。"}, {"t": 650.45, "x": "笑ったあとで、聞いていた人の\n中にひとつの考えが残ります。"}, {"t": 654.65, "x": "残るのは、この人は自分の失敗も\nよそで話すだろうという考えです。"}, {"t": 659.3333333333334, "x": "考えは口には出されません。"}, {"t": 661.3166666666667, "x": "相談の相手を選ぶ時にだけ働きます。"}, {"t": 664.1333333333333, "x": "働いた結果は選び方に出ます。"}, {"t": 666.35, "x": "困った時に、この人には話さないという選び方です。"}, {"t": 670.1166666666667, "x": "損をする人は、話の種があると\n場が盛り上がると考えがちです。"}, {"t": 674.6166666666667, "x": "盛り上がるのは本当です。"}, {"t": 676.4166666666666, "x": "その瞬間は人の輪の中心にいられます。"}, {"t": 679.2333333333333, "x": "いられる代わりに、打ち明け\n話は回ってこなくなります。"}, {"t": 682.9166666666666, "x": "回ってこないことに本人はなかなか気づけません。"}, {"t": 685.9, "x": "得をする人は、その場にいない\n人の話になると動きます。"}, {"t": 689.9166666666666, "x": "話題を少し変えるのです。"}, {"t": 691.6333333333333, "x": "変える時に、相手を注意したり\nただしたりはしません。"}, {"t": 695.2333333333333, "x": "天気や昼ごはんの話題に、自然に\n戻すだけのことが多いです。"}, {"t": 699.5166666666667, "x": "戻されたことに気づく人はあまりいません。"}, {"t": 702.15, "x": "いませんが、話を広げなかったことは\n周りの記憶に残ります。"}, {"t": 706.4833333333333, "x": "残った記憶は、この人なら話しても\n外に出ないという信用になります。"}, {"t": 711.25, "x": "人の失敗をどう扱うかは、預かった秘密を\nどう扱うかと同じに見られます。"}, {"t": 716.5833333333334, "x": "笑い話は一回分です。"}, {"t": 718.5666666666667, "x": "その一回で、相談の何回分かを手放すことがあります。"}, {"t": 722.6833333333333, "x": "第三位です。"}, {"t": 723.8, "x": "ここからは上位の三つに入っていきます。"}, {"t": 726.3833333333333, "x": "席で作業をしています。"}, {"t": 728.0833333333334, "x": "そこへちょっとした頼まれごとが来ます。"}, {"t": 730.45, "x": "頼まれた側は手を止めます。"}, {"t": 732.3, "x": "そして引き受けますと答えます。"}, {"t": 734.2833333333333, "x": "答えたあと、いつまでにという\n話はどちらからも出ません。"}, {"t": 738.1166666666667, "x": "出ないまま時間がたちます。"}, {"t": 739.9166666666666, "x": "頼んだ側は、数日後には終わっているだろうと\n考えます。"}, {"t": 743.8333333333334, "x": "引き受けた側は、手が空いた\n時にやればよいと考えています。"}, {"t": 747.8666666666667, "x": "考えている締切が二人の間で\nまったく重なっていません。"}, {"t": 751.6, "x": "重なっていないことは、催促の時に初めて分かります。"}, {"t": 755.4, "x": "頼んだ人に聞かれた時です。"}, {"t": 757.2833333333333, "x": "分かった時には、頼んだ側の\n予定はもう崩れ始めています。"}, {"t": 761.5166666666667, "x": "損をする人は、断らずに引き受けることが\n親切だと考えやすいです。"}, {"t": 766.45, "x": "引き受けた気持ちにうそはまったくありません。"}, {"t": 769.05, "x": "ないからこそ、日付を言わなかったことが\n余計に響きます。"}, {"t": 772.9, "x": "響くのは、引き受けた分だけ\n相手が待つことを決めたからです。"}, {"t": 776.8166666666667, "x": "得をする人は、引き受けると\n同時に日付をひとつ示します。"}, {"t": 780.7666666666667, "x": "示すのは、木曜の夕方までならできますという\n程度の目安です。"}, {"t": 785.25, "x": "目安が合わないこともあります。"}, {"t": 787.2333333333333, "x": "それなら頼んだ側は、その場で別の人を探せます。"}, {"t": 790.8833333333333, "x": "探せる余地を残すことが、相手の\n時間を守ることになります。"}, {"t": 795.1, "x": "守られた側は、この人の引き受けは\n当てにできると覚えます。"}, {"t": 799.0833333333334, "x": "当てにできる引き受けは、断った\n回数よりも信用を増やします。"}, {"t": 803.4833333333333, "x": "日付のない引き受けは、空白の予定と同じです。"}, {"t": 807.0833333333334, "x": "相手の手帳にそれを書かせているのです。"}, {"t": 809.5833333333334, "x": "第二位は、数字の扱いです。"}, {"t": 812.0, "x": "提出した資料に、一か所だけ\n数字の誤りを見つけたとします。"}, {"t": 816.35, "x": "小さな桁の打ち間違いです。"}, {"t": 818.3333333333334, "x": "合計には影響しません。"}, {"t": 820.2333333333333, "x": "見つけたのは、送ったあとに\n自分で読み返した時でした。"}, {"t": 824.0166666666667, "x": "直して送り直すほどでもありません。"}, {"t": 826.4333333333333, "x": "そう考えて、そのままにしておきます。"}, {"t": 829.2666666666667, "x": "そのままにしておいた誤りを、\n数日後に別の人が見つけます。"}, {"t": 833.5666666666667, "x": "見つけた人は、親切のつもりで指摘をくれます。"}, {"t": 836.9666666666667, "x": "指摘を受けて直すのは、数分で済む作業です。"}, {"t": 840.4833333333333, "x": "作業は数分です。"}, {"t": 842.1166666666667, "x": "でも見つけた人の中には別のことが残ります。"}, {"t": 845.0833333333334, "x": "残るのは、ほかの数字は大丈夫なのだろうかという\n疑いです。"}, {"t": 849.2333333333333, "x": "疑いが生まれると、確かめる回数が増えます。"}, {"t": 852.6, "x": "資料は毎回確かめられます。"}, {"t": 854.7166666666667, "x": "確かめる手間は増えていきます。"}, {"t": 856.6666666666666, "x": "増えるほど任される仕事の範囲は狭まります。"}, {"t": 859.6666666666666, "x": "損をする人は、気づいていたことを\n言うと評価が下がると考えがちです。"}, {"t": 864.35, "x": "黙っていれば、誰にも気づかれずに\n済むかもしれないと考えます。"}, {"t": 868.6666666666666, "x": "考えた通りに済むこともあります。"}, {"t": 870.9166666666666, "x": "ただ、済まなかった時の目減りは大きいです。"}, {"t": 874.0166666666667, "x": "得をする人は、気づいた時点で\n自分から訂正を送ります。"}, {"t": 878.15, "x": "送る文は、一か所の数字を直しましたという\n短いもので十分です。"}, {"t": 883.0333333333333, "x": "十分な短さで、相手はどこを\n直せばよいかすぐ分かります。"}, {"t": 887.3166666666667, "x": "分かりやすい訂正は、この人は自分の誤りを\n隠さないという印象になります。"}, {"t": 892.5666666666667, "x": "印象が先にできていれば安心です。"}, {"t": 895.0666666666667, "x": "多少の誤りがあっても資料全体は信じてもらえます。"}, {"t": 898.6166666666667, "x": "小さな数字を自分で直すかどうかは、\n残りの数字の信用を決めています。"}, {"t": 903.6833333333333, "x": "いよいよ第一位です。"}, {"t": 905.2333333333333, "x": "打ち合わせが終わる時のことです。"}, {"t": 907.3166666666667, "x": "関連の資料はあとで送りますと伝えます。"}, {"t": 910.0833333333334, "x": "伝えた本人は本気です。"}, {"t": 911.9666666666667, "x": "その時は、本当に送るつもりでいます。"}, {"t": 914.9333333333333, "x": "席に戻ると、急ぎの用事がいくつも待っています。"}, {"t": 918.4166666666666, "x": "待っていた用事を片づけます。"}, {"t": 920.3333333333334, "x": "そのうちに送る約束は頭から抜けます。"}, {"t": 923.1166666666667, "x": "抜けた約束は、言われた側の中にだけ残っています。"}, {"t": 926.95, "x": "残った側は黙って待ちます。"}, {"t": 928.9166666666666, "x": "催促するほどのことでもないからです。"}, {"t": 931.25, "x": "待っている間も仕事はなんとか進みます。"}, {"t": 933.9666666666667, "x": "その資料が無くても進むのです。"}, {"t": 936.1166666666667, "x": "進んでしまうので、約束はそのまま流れて\n消えていきます。"}, {"t": 940.2833333333333, "x": "約束は消えたように見えます。"}, {"t": 942.35, "x": "でも言われた側の記憶からは消えていません。"}, {"t": 945.1666666666666, "x": "消えていないのは、あとで送りますが\n二度三度と重なるからです。"}, {"t": 949.2833333333333, "x": "重なるたびに、この人のあとでは来ないという\n覚え方に変わります。"}, {"t": 953.5333333333333, "x": "損をする人は、相手も忘れているだろうと\n考えやすいです。"}, {"t": 957.7, "x": "忘れていてほしいという気持ちが、\nそう思わせることもあります。"}, {"t": 961.8166666666667, "x": "得をする人は、あとで送りますと言ったら\nその日のうちに送ります。"}, {"t": 966.15, "x": "その日のうちが無理な時は、\nいつ送るかだけを先に伝えます。"}, {"t": 970.2333333333333, "x": "伝えた日付を守ればいいのです。"}, {"t": 972.4333333333333, "x": "送るのが遅れても信用は減りにくいです。"}, {"t": 975.1833333333333, "x": "減りにくいのは、相手が待つ\n時間の終わりを知っていられるからです。"}, {"t": 979.4166666666666, "x": "一位がほとんどの人に覚えがあるのは、\n言うのが簡単すぎるからです。"}, {"t": 983.9833333333333, "x": "簡単に言える約束ほど、閉じたか\nどうかが静かに数えられています。"}, {"t": 988.4666666666667, "x": "ここまでで、十位から一位までがそろいました。"}, {"t": 991.65, "x": "最後に、上位の三つをもう一度並べます。"}, {"t": 994.95, "x": "第三位は、日付を言わずに引き受けだけ\n済ませることでした。"}, {"t": 998.8666666666667, "x": "第二位は、小さな数字の誤りを\n指摘されるまで放っておくことでした。"}, {"t": 1003.6666666666666, "x": "第一位は、あとで送りますと言ったまま\n送らずに流れることでした。"}, {"t": 1008.1333333333333, "x": "三つともその場では誰も困っていません。"}, {"t": 1010.7166666666667, "x": "困るのは数日たってからです。"}, {"t": 1012.75, "x": "相手の手元で初めて困ります。"}, {"t": 1014.9, "x": "しかも、どれも\n本人の中では終わったことになっています。"}, {"t": 1018.7666666666667, "x": "引き受けた時点で、気づいた時点で、\n言った時点で終わっています。"}, {"t": 1023.3666666666667, "x": "終わったつもりの約束が、相手の側では\n開いたまま残っています。"}, {"t": 1027.8666666666666, "x": "開いたまま残る約束を、ここでは\n閉じ忘れと呼んでおきます。"}, {"t": 1032.05, "x": "閉じ忘れは、大きな失敗のように\n目立つことはありません。"}, {"t": 1035.9833333333333, "x": "ありませんが、相手の記憶の中では\n同じ重さで数えられています。"}, {"t": 1040.5166666666667, "x": "十位から四位までも、よく見ると同じ形をしています。"}, {"t": 1044.4166666666667, "x": "会議の一分も備品の戻し方も、\n閉じ忘れの小さな仲間です。"}, {"t": 1049.0, "x": "信用は、閉じた約束の数だけ\n静かに積み上がっていくと言われます。"}, {"t": 1053.6333333333334, "x": "今日の十個は、その積み上がりから\n抜け落ちやすい場所の一覧でした。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
