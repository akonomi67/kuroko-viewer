t": 685.2333333333333, "i": 187}, {"t": 691.3166666666667, "i": 188}, {"t": 695.0666666666667, "i": 189}, {"t": 697.9166666666666, "i": 190}, {"t": 704.3333333333334, "i": 191}, {"t": 709.7, "i": 192}, {"t": 713.4, "i": 193}, {"t": 717.7, "i": 194}, {"t": 722.0333333333333, "i": 195}, {"t": 727.9166666666666, "i": 196}, {"t": 730.2666666666667, "i": 197}, {"t": 731.45, "i": 198}, {"t": 735.8, "i": 199}, {"t": 742.1333333333333, "i": 200}, {"t": 745.9333333333333, "i": 201}, {"t": 749.95, "i": 202}, {"t": 753.15, "i": 203}, {"t": 758.0, "i": 204}, {"t": 761.8333333333334, "i": 205}, {"t": 769.55, "i": 206}, {"t": 774.9, "i": 207}, {"t": 778.4166666666666, "i": 208}, {"t": 781.7666666666667, "i": 209}, {"t": 787.75, "i": 210}], "subs": [{"t": 0.0, "x": "1987年10月4日、午後4時30分。"}, {"t": 4.583333333333333, "x": "山口県下関市の沖に浮かぶ、\n周囲およそ1.6キロの無人島。"}, {"t": 9.75, "x": "そこに組まれたリングの上で、\n2人の男が向かい合いました。"}, {"t": 13.75, "x": "アントニオ猪木と、マサ斎藤です。"}, {"t": 16.633333333333333, "x": "この試合には、観客が1人もいませんでした。"}, {"t": 19.95, "x": "チケットは売られていません。"}, {"t": 21.666666666666668, "x": "座席もありません。"}, {"t": 22.983333333333334, "x": "レフェリーもいませんでした。"}, {"t": 24.6, "x": "時間の制限もありません。"}, {"t": 26.483333333333334, "x": "反則を取る人間がいない以上、\n反則負けもありません。"}, {"t": 30.516666666666666, "x": "試合が終わったのは、\n2時間5分14秒後でした。"}, {"t": 34.3, "x": "そのころには日が落ち、島は\n真っ暗になっていました。"}, {"t": 37.916666666666664, "x": "今回は、1987年10月4日に\n巌流島で行われた試合を、"}, {"t": 43.61666666666667, "x": "具体的な日付と数字をもとに辿っていきます。"}, {"t": 46.75, "x": "最後までご覧いただければ幸いです。"}, {"t": 49.25, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 54.833333333333336, "x": "まず、この試合の相手が\n何者だったのかを確認しておきます。"}, {"t": 59.266666666666666, "x": "マサ斎藤、本名は斎藤昌典。"}, {"t": 62.233333333333334, "x": "プロレスに入る前は、\nアマチュアレスリングの選手でした。"}, {"t": 66.0, "x": "1964年、東京オリンピックにレスリングの\n日本代表として出場しています。"}, {"t": 72.21666666666667, "x": "つまり、五輪に出た人間です。"}, {"t": 74.9, "x": "プロレスに入る前に、国を代表して\n試合をした経歴があります。"}, {"t": 79.4, "x": "その後アメリカに渡り、長く\nアメリカのリングで生活しました。"}, {"t": 83.78333333333333, "x": "日本の団体に所属して日本で\n売れる、という道ではありません。"}, {"t": 88.25, "x": "アメリカの各地区を回り、向こうのファンに\n顔を覚えられ、向こうで王座を巻く。"}, {"t": 93.65, "x": "そういう選手でした。"}, {"t": 95.15, "x": "日本のファンにとって、この人は\n「向こうで生きている日本人」です。"}, {"t": 99.41666666666667, "x": "たまに日本に来ると、外国人選手のような\n扱いを受けることもありました。"}, {"t": 104.4, "x": "言葉も立ち居振る舞いも、日本の\n選手とは違って見えたからです。"}, {"t": 108.63333333333334, "x": "そして1984年、マサ斎藤は\nアメリカで事件を起こし、逮捕されます。"}, {"t": 115.11666666666666, "x": "警官への暴行で、1985年6月から1年半、\nアメリカ国内の刑務所に入りました。"}, {"t": 122.7, "x": "プロレスラーにとって、\n40代前半は最後の勝負どころです。"}, {"t": 127.2, "x": "その時間を、刑務所の中で失いました。"}, {"t": 130.31666666666666, "x": "日本のリングに本格的に\n戻ってきたのは1987年です。"}, {"t": 134.95, "x": "40代半ばになっていました。"}, {"t": 136.93333333333334, "x": "普通に考えれば、ここから\n上に行ける選手ではありません。"}, {"t": 141.01666666666668, "x": "戻ってきた場所には、藤波辰巳がいます。"}, {"t": 144.16666666666666, "x": "長州力がいます。"}, {"t": 145.56666666666666, "x": "前田日明がいます。"}, {"t": 146.98333333333332, "x": "どの選手も、マサ斎藤より若く、当時の\n日本のリングで最も勢いのある顔ぶれでした。"}, {"t": 153.63333333333333, "x": "それでもマサ斎藤は、その全員を飛ばして、\nいきなり猪木に向かっていきました。"}, {"t": 159.13333333333333, "x": "1987年3月、「INOKI闘魂LIVE \nPARTⅡ」という"}, {"t": 164.48333333333332, "x": "興行で、2人はシングルマッチをやっています。"}, {"t": 167.75, "x": "その後もマサ斎藤は、繰り返し猪木との\n再戦をアピールし続けました。"}, {"t": 172.71666666666667, "x": "この執着が、この試合の出発点です。"}, {"t": 176.0, "x": "新日本プロレスの興行の流れから\n自然に出てきたカードではなく、"}, {"t": 180.06666666666666, "x": "1人の選手が言い続けたことから\n始まっています。"}, {"t": 183.45, "x": "1987年、猪木とマサ斎藤は大きな\n会場で立て続けに一騎打ちをしています。"}, {"t": 189.98333333333332, "x": "3月26日、大阪城ホール。"}, {"t": 193.11666666666667, "x": "4月27日、両国国技館。"}, {"t": 196.25, "x": "そして10月4日の巌流島です。"}, {"t": 198.66666666666666, "x": "同じ相手と、1年のうちに3回。"}, {"t": 201.55, "x": "当時の新日本プロレスで、そこまで1人の\n相手に時間を使った例はほとんどありません。"}, {"t": 207.3, "x": "ここで、当時の新日本プロレスの\n状況を見ておきます。"}, {"t": 211.28333333333333, "x": "1987年の猪木は44歳でした。"}, {"t": 214.95, "x": "1972年に団体を作ってから、\n15年が経っています。"}, {"t": 219.81666666666666, "x": "リングの中心は、すでに次の\n世代に移り始めていました。"}, {"t": 223.95, "x": "藤波辰巳がいます。"}, {"t": 225.5, "x": "長州力がいます。"}, {"t": 226.91666666666666, "x": "前田日明がいます。"}, {"t": 228.31666666666666, "x": "同じ1987年には、両国国技館で\n観客が暴れる騒ぎも起きていました。"}, {"t": 234.55, "x": "試合の内容に納得しなかった客が、\n座布団を投げ、椅子を壊した事件です。"}, {"t": 240.58333333333334, "x": "つまり1987年の新日本プロレスは、客が\n本気で怒るくらい熱があった団体でした。"}, {"t": 247.36666666666667, "x": "動員も、注目も、この時期は十分にあります。"}, {"t": 251.5, "x": "問題は、その中心が誰なのかでした。"}, {"t": 254.56666666666666, "x": "猪木は44歳です。"}, {"t": 256.4166666666667, "x": "試合のスピードでも、力でも、若い3人と\n正面から比べれば分が悪くなります。"}, {"t": 262.68333333333334, "x": "実際、リングの上で最も強く見える\n選手が誰かという話になったとき、"}, {"t": 267.76666666666665, "x": "猪木の名前が真っ先に出る\n時期ではなくなっていました。"}, {"t": 271.21666666666664, "x": "団体を作った人間が、自分の\n団体の中で一番ではなくなる。"}, {"t": 275.95, "x": "これは、どの世界でも起きることです。"}, {"t": 278.6166666666667, "x": "そしてたいていの場合、\nそこから静かに退いていきます。"}, {"t": 282.48333333333335, "x": "猪木はそうしませんでした。"}, {"t": 284.25, "x": "この年、猪木は普通のカードでは\n組めない試合を何度も打っています。"}, {"t": 288.85, "x": "その最後に出てきたのが、巌流島でした。"}, {"t": 291.95, "x": "巌流島は、宮本武蔵と佐々木小次郎が\n決闘したと伝えられている島です。"}, {"t": 297.25, "x": "正式な名前は船島といいます。"}, {"t": 299.6333333333333, "x": "人は住んでいません。"}, {"t": 301.06666666666666, "x": "そこにリングを組み、客を入れず、\nレフェリーも置かず、時間も決めずに戦う。"}, {"t": 307.01666666666665, "x": "これが、この試合の条件でした。"}, {"t": 309.68333333333334, "x": "決闘の島で決闘をやる、という発想です。"}, {"t": 313.23333333333335, "x": "プロレスの興行としては、\n理屈よりも絵が先にある企画でした。"}, {"t": 317.46666666666664, "x": "リングは船で運ばれ、島の上で組まれています。"}, {"t": 320.98333333333335, "x": "電気も、客席も、売店もありません。"}, {"t": 324.4, "x": "そこに置かれたのは、リングと、\nそれを照らすための火だけでした。"}, {"t": 328.76666666666665, "x": "なぜ観客を入れないのか。"}, {"t": 330.68333333333334, "x": "興行としては、これは異常な判断です。"}, {"t": 333.8, "x": "チケット収入がゼロになるからです。"}, {"t": 336.1333333333333, "x": "この試合の収入は、テレビ朝日から\n入る放映権料が中心でした。"}, {"t": 341.2, "x": "つまり、会場で見せる商売ではなく、\n放送で見せる商売として組まれた試合と"}, {"t": 347.01666666666665, "x": "いうことになります。"}, {"t": 348.05, "x": "そして、客のいない島には、客の\n代わりに幟が立てられました。"}, {"t": 352.73333333333335, "x": "1本10万円の幟が、130本です。"}, {"t": 356.25, "x": "総経費は1,160万円と記録されています。"}, {"t": 359.6333333333333, "x": "観客が1人もいない興行で、収支は黒字でした。"}, {"t": 363.31666666666666, "x": "この数字は、当時のプロレスの\n商売の形を表しています。"}, {"t": 367.6, "x": "会場に人を入れて稼ぐのではなく、\nその日の絵をテレビに売る。"}, {"t": 371.85, "x": "巌流島は、その極端な例でした。"}, {"t": 374.73333333333335, "x": "なぜこの相手だったのかについては、\n猪木本人の言葉が残っています。"}, {"t": 379.48333333333335, "x": "マサも自分も、すべてを捨てて\n戦いに臨むことができるから。"}, {"t": 383.51666666666665, "x": "自分は離婚して独りになり、マサは\n刑務所に入ってすべてを断ち切られた。"}, {"t": 388.55, "x": "しがらみを振り切って裸一貫で\n戦えるのは、自分とマサしかいない。"}, {"t": 393.28333333333336, "x": "そういう趣旨の説明です。"}, {"t": 395.15, "x": "当日の記録に入る前に、\n前日のことにも触れておきます。"}, {"t": 399.3666666666667, "x": "決戦前日の10月3日、\n猪木は下関に入りました。"}, {"t": 403.81666666666666, "x": "そこで40度近い熱を出して寝込んでいます。"}, {"t": 406.81666666666666, "x": "帯同していた関係者が氷をかき集め、38.5度\nあたりまで下げたと伝えられています。"}, {"t": 413.1333333333333, "x": "汗を拭いたタオルは7本になったと\nいう話も残っています。"}, {"t": 416.9166666666667, "x": "翌日、2時間5分14秒の試合が行われました。"}, {"t": 421.1, "x": "当日の記録を追っていきます。"}, {"t": 423.06666666666666, "x": "猪木が島に着いたのは、午後2時31分。"}, {"t": 426.55, "x": "マサ斎藤が着いたのは、午後4時。"}, {"t": 429.1666666666667, "x": "試合開始の合図が出たのが、\n午後4時30分でした。"}, {"t": 433.15, "x": "立会人として、山本小鉄と\n坂口征二がリングサイドにいます。"}, {"t": 437.76666666666665, "x": "2人とも新日本プロレスの人間で、\nレフェリーではありません。"}, {"t": 441.98333333333335, "x": "判定をするためではなく、\nその場に立つためにいました。"}, {"t": 445.8, "x": "テレビ朝日のカメラも、リングに\n近づくことは許されませんでした。"}, {"t": 450.2, "x": "リングから離れた場所に1本のロープが\n張られ、取材陣はそこから中に入れません。"}, {"t": 455.56666666666666, "x": "記録として残す人間まで、\n距離を置かされたということです。"}, {"t": 459.56666666666666, "x": "試合が始まってから、しばらくは\n明るさがありました。"}, {"t": 463.31666666666666, "x": "しかし、10月の日没は早く来ます。"}, {"t": 466.45, "x": "午後6時、リングの\nコーナーに置かれたかがり火に火が入りました。"}, {"t": 470.68333333333334, "x": "試合開始から1時間半が経っています。"}, {"t": 473.45, "x": "ここから先は、炎の明かりだけで\n戦うことになりました。"}, {"t": 477.21666666666664, "x": "マサ斎藤はのちに、気がついたら\n周りが暗くなっていた、"}, {"t": 481.0, "x": "日が落ちるのも分からなかったと語っています。"}, {"t": 483.9, "x": "決着がついたのは、午後6時35分すぎ。"}, {"t": 487.4166666666667, "x": "2時間5分14秒でした。"}, {"t": 489.48333333333335, "x": "最後は猪木が裸絞めでマサ斎藤を絞め落とし、\nTKOという扱いになっています。"}, {"t": 495.4166666666667, "x": "レフェリーがいないので、\nカウントもゴングもありません。"}, {"t": 498.8333333333333, "x": "相手が動かなくなったことで、\n終わりになりました。"}, {"t": 502.21666666666664, "x": "2人とも血だらけでした。"}, {"t": 503.76666666666665, "x": "立っているのがやっとの\n状態だったと伝えられています。"}, {"t": 506.98333333333335, "x": "この2時間5分のあいだ、\n拍手は1度もありません。"}, {"t": 510.6166666666667, "x": "歓声も、コールも、ブーイングもありません。"}, {"t": 514.2833333333333, "x": "聞こえていたのは、波の音と、2人の\n呼吸と、体が当たる音だけでした。"}, {"t": 519.9666666666667, "x": "途中からは、火の明かりが\n届く範囲しか見えていません。"}, {"t": 523.6666666666666, "x": "リングの外に出れば、そこは暗い島です。"}, {"t": 526.6833333333333, "x": "どこまでが試合の\n場所なのかも、はっきりしない状態でした。"}, {"t": 530.65, "x": "この試合には、もう\n1つ記録されている事実があります。"}, {"t": 534.4666666666667, "x": "猪木は、この試合の2日前に\n離婚届を提出しています。"}, {"t": 538.8, "x": "44歳、団体の中心から外れつつある\n時期、私生活も大きく動いていた。"}, {"t": 545.0833333333334, "x": "その状態で、客のいない\n島に行ったということになります。"}, {"t": 549.0, "x": "本人がその2つを結びつけて\n語った記録はありません。"}, {"t": 552.5666666666667, "x": "ですので、ここは事実を\n並べるだけにとどめます。"}, {"t": 555.9333333333333, "x": "ここまでが、記録に残っている事実です。"}, {"t": 558.9666666666667, "x": "では、この試合は何だったのか。"}, {"t": 561.5333333333333, "x": "まず、プロレスとして見ると、\nこれは非常に不利な形式です。"}, {"t": 566.0666666666667, "x": "プロレスは、観客の声で試合の熱が決まります。"}, {"t": 569.6166666666667, "x": "どこで大きな技を出すか、どこで我慢するか。"}, {"t": 572.9166666666666, "x": "その判断は、会場の反応を受けて行われます。"}, {"t": 576.7333333333333, "x": "その観客がいない。"}, {"t": 578.15, "x": "歓声も、ため息も、拍手もない。"}, {"t": 581.2333333333333, "x": "返ってくるものが何もない状態で、\n2時間5分を戦ったということです。"}, {"t": 586.1833333333333, "x": "さらに、レフェリーもいません。"}, {"t": 588.3666666666667, "x": "プロレスのレフェリーは、勝敗を\n決めるだけの存在ではなく、"}, {"t": 592.1833333333333, "x": "試合の進み方を整える役でもあります。"}, {"t": 595.3, "x": "それも無い。"}, {"t": 596.1333333333333, "x": "つまりこの試合は、プロレスから、\nプロレスを成り立たせている要素を"}, {"t": 600.7333333333333, "x": "ほとんど外した状態で行われました。"}, {"t": 603.1166666666667, "x": "そのうえで2時間5分続いたという\n事実は、それ自体が答えになっています。"}, {"t": 608.2, "x": "見ている人がいなくても、この\n2人は最後までやめなかった。"}, {"t": 612.1333333333333, "x": "普通に考えれば、この形式は途中で崩れます。"}, {"t": 615.8666666666667, "x": "誰も見ていないのですから、\n適当なところで終わらせても分かりません。"}, {"t": 620.2, "x": "止める人間もいません。"}, {"t": 621.8166666666667, "x": "それが2時間5分続いたということは、\n2人が同じことを考えていたということです。"}, {"t": 627.3166666666667, "x": "ここで手を抜いたら、この\n試合を組んだ意味が消える。"}, {"t": 630.7, "x": "その一点だけで、暗い島の上で\n2時間立ち続けたことになります。"}, {"t": 635.2833333333333, "x": "もう1つ、興行として見た\n場合の意味があります。"}, {"t": 638.8666666666667, "x": "1987年の猪木は、リングの中心を\n若い世代に譲りつつありました。"}, {"t": 644.6666666666666, "x": "藤波、長州、前田といった選手たちは、\n猪木より強く見える試合をすることができます。"}, {"t": 651.6666666666666, "x": "そこで同じ土俵に立てば、比較されるだけです。"}, {"t": 654.9166666666666, "x": "だから猪木は、比較のしようがない\n場所を選んだ、という見方ができます。"}, {"t": 659.8333333333334, "x": "無人島で、観客なしで、2時間を超える。"}, {"t": 663.45, "x": "これは、若い選手が\n真似できるものではありません。"}, {"t": 666.9, "x": "体力の話ではなく、そんな試合を\n組ませられる立場かどうかという話です。"}, {"t": 672.05, "x": "猪木が最後まで持っていたのは、\n試合の強さではなく、"}, {"t": 675.7, "x": "こういう形式そのものを\n世の中に受け入れさせる"}, {"t": 678.9, "x": "力だったのではないでしょうか。"}, {"t": 680.6666666666666, "x": "猪木という選手のキャリアを並べると、\nこの傾向ははっきりしています。"}, {"t": 685.2333333333333, "x": "ボクシングの世界王者と戦い、柔道の\n金メダリストと戦い、空手家と戦った。"}, {"t": 691.3166666666667, "x": "どれも、それまでのプロレスの\n枠の外にある試合です。"}, {"t": 695.0666666666667, "x": "巌流島も、同じ系列にあります。"}, {"t": 697.9166666666666, "x": "相手を変えるのではなく、場所と条件を変えた\n異種格闘技戦だった、という見方もできます。"}, {"t": 704.3333333333334, "x": "実際、この試合はテレビ朝日の\nゴールデンタイムで特番として放送されました。"}, {"t": 709.7, "x": "客が1人もいない試合を、地上波が特番で流す。"}, {"t": 713.4, "x": "それを成立させたこと自体が、\nこの人の仕事だったとも言えます。"}, {"t": 717.7, "x": "マサ斎藤の側から見ても、この\n試合の意味は大きなものでした。"}, {"t": 722.0333333333333, "x": "40代半ばで日本に戻り、失った時間を\n取り戻す方法を探していた選手が、"}, {"t": 727.9166666666666, "x": "猪木と2時間5分やり合った。"}, {"t": 730.2666666666667, "x": "勝ってはいません。"}, {"t": 731.45, "x": "それでも、この試合はマサ斎藤の\n代表作として残りました。"}, {"t": 735.8, "x": "プロレスは勝敗だけで評価が決まる世界ではない、と\nいうことが、はっきり出た例でもあります。"}, {"t": 742.1333333333333, "x": "巌流島の試合は、現在まで語り継がれています。"}, {"t": 745.9333333333333, "x": "無観客試合という言葉が世の中に\n知られるようになったずっと前に、"}, {"t": 749.95, "x": "それを興行として成立させた例だからです。"}, {"t": 753.15, "x": "長い年月が経ってから、スポーツが\n観客を入れられない時期がありました。"}, {"t": 758.0, "x": "そのときに、この試合が何度も\n引き合いに出されています。"}, {"t": 761.8333333333334, "x": "1987年10月4日に無人島で行われた\n2時間5分14秒は、そういう形で残りました。"}, {"t": 769.55, "x": "今回の物語を通して、皆様の中に\nアントニオ猪木とマサ斎藤という2人の"}, {"t": 774.9, "x": "プロレスラーの新しい一面が\n刻まれていれば幸いです。"}, {"t": 778.4166666666666, "x": "最後までご視聴いただき誠に\nありがとうございました。"}, {"t": 781.7666666666667, "x": "もしこの動画が心に残るものであったなら、ぜひ\nチャンネル登録と高評価をお願いいたします。"}], "w": 960, "h": 540, "n_cuts": 211};
const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
