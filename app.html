<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>くろこ 動画確認</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b8422f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="くろこ確認">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f;--done:#2f7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a;--done:#63c48a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:600}
header .sub{font-size:12.5px;color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 16px;max-width:720px;width:100%;margin:0 auto}
h2{font-size:13px;color:var(--dim);margin:18px 4px 6px;font-weight:600}
h2 span{font-weight:400;margin-left:6px}
ul{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:52px}
li:first-child{border-top:0}
li input{width:22px;height:22px;flex:none;accent-color:var(--done)}
li .no{color:var(--dim);font-size:13px;flex:none;min-width:2.6em}
li .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.checked .name{color:var(--dim);text-decoration:line-through}
a.see{flex:none;background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;padding:6px 14px;font-size:14px}
.yet{flex:none;color:var(--dim);font-size:12.5px}
.empty{text-align:center;color:var(--dim);padding:48px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px;font-size:14px}
.card b{display:block;margin-bottom:4px}
.card button{margin-top:8px;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:8px 16px;font-size:14px}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--dim);padding:8px 0 6px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>くろこ 動画確認</h1>
  <div class="sub" id="sub">読み込み中…</div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-t="todo"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>未確認</button>
  <button data-t="done"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>確認済み</button>
  <button data-t="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M12 11v5"/></svg>設定</button>
</nav>
<script>
// 中身は既存ページと同じ index_data.json。チェックも既存ページと同じ保存場所・同じ印を使う。
const KEY='kuroko_viewer_checks';
let data=null, map={}, tab='todo', chip='', syncUrl='', syncMsg='この端末の中だけに残ります';
try{ tab=localStorage.getItem('kuroko_app_tab')||'todo'; }catch(e){}
try{ map=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ map={}; }
const isOn=id=>(map[id]||0)>0;
const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify(map));}catch(e){} };
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function merge(a,b){const o=Object.assign({},a);for(const k in b){if(Math.abs(b[k]||0)>Math.abs(o[k]||0))o[k]=b[k];}return o;}

async function findSync(){            // 既存ページに書いてある預け先をそのまま使う
  try{
    const t=await (await fetch('index.html?t='+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/const SYNC='([^']*)'/);
    if(m&&m[1]&&m[1].indexOf('script.google.com')<0) syncUrl=m[1];
  }catch(e){}
}
let busy=false;
async function sync(){
  if(!syncUrl||busy) return; busy=true;
  try{
    const r=await fetch(syncUrl+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const j=await r.json();
    const remote=(j&&j.data&&j.data.ids)||{};
    const merged=merge(map,remote);
    const changed=JSON.stringify(merged)!==JSON.stringify(map);
    map=merged; save();
    if(JSON.stringify(merged)!==JSON.stringify(remote)){
      await fetch(syncUrl,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'kv-store',data:{ids:map}})});
    }
    syncMsg='ほかの端末とつながっています';
    if(changed) render();
  }catch(e){ syncMsg='保管先につながりませんでした（この端末の中だけに残ります）'; }
  busy=false; if(tab==='info') render();
}
function toggle(id){
  map[id]=isOn(id)?-Date.now():Date.now(); save(); render(); sync();
}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const main=document.getElementById('main'), chips=document.getElementById('chips');
  if(!data){ return; }
  const items=[]; (data.groups||[]).forEach(g=>g.items.forEach(it=>items.push(it)));
  const doneN=items.filter(i=>isOn(i.slug)).length;
  document.getElementById('sub').textContent='全'+items.length+'本 / 確認済み'+doneN+'本 / 残り'+(items.length-doneN)+'本';
  chips.style.display=tab==='info'?'none':'flex';
  if(tab!=='info'){
    const labels=['全部'].concat((data.groups||[]).map(g=>g.label));
    chips.innerHTML=labels.map(l=>{
      const v=l==='全部'?'':l;
      return '<button class="chip'+(v===chip?' on':'')+'" data-c="'+esc(v)+'">'+esc(l)+'</button>';
    }).join('');
  }
  if(tab==='info'){
    main.innerHTML='<div class="card"><b>つながり</b>'+esc(syncMsg)+'</div>'
      +'<div class="card"><b>データ</b>既存ページと同じ一覧を読んでいます。<br><button id="reload">最新にする</button></div>'
      +'<div class="card"><b>元のページ</b><a href="./" style="color:var(--accent)">今までの一覧ページを開く</a></div>';
    document.getElementById('reload').onclick=()=>load(true);
    return;
  }
  const want=tab==='done';
  let html='';
  (data.groups||[]).forEach(g=>{
    if(chip&&g.label!==chip) return;
    const rows=g.items.filter(i=>isOn(i.slug)===want);
    if(!rows.length) return;
    html+='<h2>'+esc(g.label)+'<span>'+rows.length+'本</span></h2><ul>'+rows.map(i=>{
      const btn=i.url?'<a class="see" href="'+esc(i.url)+'" target="_blank" rel="noopener">見る</a>':'<span class="yet">未作成</span>';
      const on=isOn(i.slug);
      return '<li class="'+(on?'checked':'')+'"><input type="checkbox" data-id="'+esc(i.slug)+'"'+(on?' checked':'')+'><span class="no">'+esc(i.no)+'</span><span class="name">'+esc(i.title)+'</span>'+btn+'</li>';
    }).join('')+'</ul>';
  });
  main.innerHTML=html||'<div class="empty">'+(want?'確認済みはまだありません':'未確認はありません')+'</div>';
}
document.getElementById('nav').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  tab=b.dataset.t; try{localStorage.setItem('kuroko_app_tab',tab);}catch(x){}
  render(); document.getElementById('main').scrollTop=0;
};
document.getElementById('chips').onclick=e=>{
  const b=e.target.closest('.chip'); if(!b) return; chip=b.dataset.c; render();
};
document.getElementById('main').onchange=e=>{
  if(e.target.matches('input[data-id]')) toggle(e.target.dataset.id);
};
async function load(force){
  try{
    const r=await fetch('index_data.json?t='+Date.now(),{cache:'no-store'});
    data=await r.json();
  }catch(e){
    if(!data) document.getElementById('sub').textContent='一覧を読めませんでした（電波を確認してください）';
    return;
  }
  render(); if(force) sync();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ load(false); sync(); } });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
(async()=>{ await findSync(); await load(false); sync(); })();
</script>
</body>
</html>
