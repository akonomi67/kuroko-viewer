<script>
const D={"name": "全日本プロレス中継の最期", "file": "271_編集用", "dur": 920.5333125, "segs": [], "subs": [{"t": 0.0, "x": "中継を打ち切る。"}, {"t": 1.2666666666666666, "x": "日本テレビがそう発表したのは、\n2000年6月19日のことでした。"}, {"t": 6.033333333333333, "x": "土曜の夜8時で始まった番組が、\n27年8か月で終わるという知らせです。"}, {"t": 11.666666666666666, "x": "同じ日、横浜市青葉区の\n全日本プロレス道場でも会見が開かれました。"}, {"t": 16.966666666666665, "x": "会見に出た選手は2人だけです。"}, {"t": 19.266666666666666, "x": "川田と渕でした。"}, {"t": 20.6, "x": "2人はファンに謝り、\n全日本プロレスは続くと訴えています。"}, {"t": 25.133333333333333, "x": "この時点で、団体そのものはまだ残っていました。"}, {"t": 28.65, "x": "次の興行の日程も決まっていました。"}, {"t": 31.166666666666668, "x": "消えたのは団体ではありません。"}, {"t": 33.166666666666664, "x": "団体を映し続けてきたテレビの方でした。"}, {"t": 35.93333333333333, "x": "発表の6日前に、社長だった三沢光晴が\n全日本を去っています。"}, {"t": 40.9, "x": "日本テレビは、残った団体を\n映さない道を選びました。"}, {"t": 44.81666666666667, "x": "1年もたたないうちに、\n同じ日本テレビが別の中継を始めます。"}, {"t": 49.46666666666667, "x": "映っていたのは、去った三沢の団体でした。"}, {"t": 52.61666666666667, "x": "なぜ日本テレビは、27年の\n相手から手を引いたのでしょうか？"}, {"t": 57.13333333333333, "x": "そして、その中継はどこへ\n移っていったのでしょうか？"}, {"t": 61.016666666666666, "x": "今回は、全日本プロレス中継の\n最後の13か月を追います。"}, {"t": 65.73333333333333, "x": "見るのは日本テレビの側からです。"}, {"t": 67.93333333333334, "x": "新聞と雑誌に残った日付をもとに辿っていきます。"}, {"t": 71.41666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 73.91666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 79.5, "x": "この番組の始まりは、\n団体の始まりより早いものでした。"}, {"t": 83.6, "x": "日本テレビは1972年10月7日に\n中継を始めています。"}, {"t": 88.43333333333334, "x": "枠は毎週土曜の夜8時です。"}, {"t": 90.71666666666667, "x": "ゴールデンタイムでした。"}, {"t": 92.13333333333334, "x": "団体の旗揚げ戦は、そのあとの10月後半です。"}, {"t": 96.03333333333333, "x": "馬場は日本プロレスを出たばかりでした。"}, {"t": 98.45, "x": "そのジャイアント馬場を、\n日本テレビが全面的に後押ししました。"}, {"t": 102.81666666666666, "x": "団体の設立そのものを、\n日本テレビが支えた形です。"}, {"t": 106.96666666666667, "x": "この番組と団体は、\n最初から切り離せない関係でした。"}, {"t": 111.11666666666666, "x": "実況席の顔ぶれも27年の間に変わっていきます。"}, {"t": 114.83333333333333, "x": "1989年には、福澤朗が実況の担当を始めます。"}, {"t": 120.01666666666667, "x": "福澤の担当は1997年まで続きました。"}, {"t": 123.85, "x": "放送の時間は何度も動いています。"}, {"t": 126.3, "x": "ゴールデンから\n始まった枠は、やがて深夜へ移りました。"}, {"t": 130.18333333333334, "x": "1990年には、団体そのものが揺れます。"}, {"t": 134.01666666666668, "x": "天龍源一郎が全日本を去った年です。"}, {"t": 136.93333333333334, "x": "福澤はのちに、そのころの\n社内の空気を語っています。"}, {"t": 140.86666666666667, "x": "日本テレビのプロレス担当者の間には、\nある雰囲気がありました。"}, {"t": 145.3, "x": "もうダメかもしれない、というものです。"}, {"t": 147.98333333333332, "x": "それでも番組はそこで終わりませんでした。"}, {"t": 150.66666666666666, "x": "1990年5月14日の東京体育館で、\nタイガーマスクがマスクを脱ぎます。"}, {"t": 156.86666666666667, "x": "三沢光晴が素顔に戻った夜でした。"}, {"t": 159.55, "x": "そこから三沢たちの時代が始まります。"}, {"t": 162.06666666666666, "x": "川田、田上明、小橋建太を入れた4人です。"}, {"t": 166.11666666666667, "x": "4人の試合はのちに\n四天王プロレスと呼ばれました。"}, {"t": 169.35, "x": "1994年の全日本は、年7回の\n日本武道館大会を満員にしました。"}, {"t": 175.6, "x": "福澤は90年代の全日本をこう振り返りました。"}, {"t": 179.18333333333334, "x": "試合開始のゴングが\n鳴った瞬間からクライマックス。"}, {"t": 182.41666666666666, "x": "ただし番組の枠は戻りませんでした。"}, {"t": 184.93333333333334, "x": "この時期の中継は、深夜の枠です。"}, {"t": 187.81666666666666, "x": "長さは30分でした。"}, {"t": 189.65, "x": "試合が熱くなっても、\n放送の時間は短いままでした。"}, {"t": 193.66666666666666, "x": "海外の記事には、番組の名前が\nプロレス30と書かれています。"}, {"t": 198.18333333333334, "x": "大きな区切りは1999年に来ました。"}, {"t": 201.48333333333332, "x": "1月31日にジャイアント馬場が亡くなります。"}, {"t": 204.73333333333332, "x": "同じ年の5月に三沢が新しい社長になりました。"}, {"t": 208.1, "x": "37歳での就任でした。"}, {"t": 210.33333333333334, "x": "この人事には、馬場の妻が反対していました。"}, {"t": 213.65, "x": "東京スポーツがそう伝えています。"}, {"t": 215.9, "x": "理由は、経営の経験がないことでした。"}, {"t": 219.0, "x": "馬場夫人はのちにこう明かしています。\nまだ早い。若すぎる。"}, {"t": 223.08333333333334, "x": "三沢が社長になっても、\n会社の持ち主は変わりません。"}, {"t": 227.0, "x": "カナダのプロレス専門サイトに、\nスラム・レスリングがあります。"}, {"t": 231.0, "x": "ここは、馬場夫人の持ち分を\n85パーセントと伝えました。"}, {"t": 235.36666666666667, "x": "日本テレビもまた全日本の株主の1つでした。"}, {"t": 238.5, "x": "つまり日本テレビは番組を流す側でした。"}, {"t": 241.43333333333334, "x": "同時に、会社の株を持つ側でもありました。"}, {"t": 244.75, "x": "三沢の社長の期間は約1年です。"}, {"t": 247.38333333333333, "x": "スラム・レスリングは、\n三沢の側の言い分を伝えています。"}, {"t": 251.33333333333334, "x": "試合の組み方で、\n自由にできなかったという内容です。"}, {"t": 255.25, "x": "お金の扱いでも、意見が割れていました。"}, {"t": 258.26666666666665, "x": "馬場夫人の側には、1972年からの\n会社の形を守るという立場がありました。"}, {"t": 264.48333333333335, "x": "三沢は退団の気持ちを、のちにこう語りました。"}, {"t": 267.8833333333333, "x": "なんだよ、この会社!?と\n思う気持ちが膨れすぎて。"}, {"t": 272.05, "x": "2000年に入ると、まず番組の枠が動きます。"}, {"t": 275.8, "x": "4月に放送は水曜の深夜へ移りました。"}, {"t": 278.85, "x": "日付が変わった午前1時45分からの30分です。"}, {"t": 282.73333333333335, "x": "それまでの日曜の\n深夜より、さらに遅い時間でした。"}, {"t": 286.68333333333334, "x": "そして5月13日にジャンボ鶴田が亡くなります。"}, {"t": 289.95, "x": "かつてこの中継の看板だった男でした。"}, {"t": 292.78333333333336, "x": "ここから、日本テレビの相手が揺れ始めます。"}, {"t": 295.95, "x": "5月28日、東京で全日本の\n取締役会が開かれました。"}, {"t": 301.1, "x": "この席で三沢は社長の座を降ります。"}, {"t": 303.53333333333336, "x": "週刊プロレスは、解任と書きました。"}, {"t": 306.55, "x": "東京スポーツも、のちに\n解任だったと書いています。"}, {"t": 310.06666666666666, "x": "ただし同じ東京スポーツの別の記事には、\n三沢が自ら申し出たとあります。"}, {"t": 315.25, "x": "スラム・レスリングも、\n本人が辞意を出したと伝えました。"}, {"t": 318.98333333333335, "x": "資料によって、書き方は\nこのように分かれています。"}, {"t": 322.56666666666666, "x": "確かなのは、シリーズが終わるまで\n伏せられたことです。"}, {"t": 326.0833333333333, "x": "三沢は、そのあともシリーズの\nリングに上がり続けました。"}, {"t": 329.85, "x": "見ている人は、社長が\n替わったことをまだ知りません。"}, {"t": 333.28333333333336, "x": "表に出たのは6月でした。"}, {"t": 335.15, "x": "東京スポーツの1面に、見出しが載ります。"}, {"t": 338.4, "x": "三沢社長の辞任と退団でした。"}, {"t": 340.65, "x": "6月12日、全日本の事務所では\n三沢の机が片づけられていました。"}, {"t": 345.8333333333333, "x": "東京スポーツのカメラマンが\nその日に確かめています。"}, {"t": 349.06666666666666, "x": "6月13日、東京の虎ノ門で\n定例の役員会が開かれました。"}, {"t": 354.3333333333333, "x": "会議は10分で終わりました。"}, {"t": 356.3, "x": "辞職を申し出た役員は6人です。"}, {"t": 358.8833333333333, "x": "三沢のほか、百田光雄、\n田上明、小橋建太らでした。"}, {"t": 364.06666666666666, "x": "役員は全部で11人でした。"}, {"t": 366.45, "x": "半分を超える数です。"}, {"t": 368.0833333333333, "x": "この6人の中には、日本テレビの\n側から入っていた役員もいました。"}, {"t": 372.75, "x": "スラム・レスリングは、\nこの日の記事ですでに書いています。"}, {"t": 376.3666666666667, "x": "三沢の新団体を、日本テレビが\n放送する話が進んでいるという内容です。"}, {"t": 381.9, "x": "全日本は放送先を\n失うかもしれない、とも伝えました。"}, {"t": 386.1333333333333, "x": "日本の中継の行方は、この時点で\n海外でも記事になっていました。"}, {"t": 390.71666666666664, "x": "6月14日には残る側も動きます。"}, {"t": 393.46666666666664, "x": "川田が全日本の事務所で会見し、\n契約の更新を発表しました。"}, {"t": 398.6333333333333, "x": "川田はこう話しています。"}, {"t": 400.4166666666667, "x": "全日本プロレスという馬場さんが\n作ってきた名前を捨て切れない。"}, {"t": 404.21666666666664, "x": "渕も16日に契約を更新しました。"}, {"t": 407.06666666666666, "x": "馬場夫人も14日に声明を出しています。"}, {"t": 409.96666666666664, "x": "起きたことへの戸惑いを示す内容でした。"}, {"t": 412.6, "x": "6月16日、東京のディファ有明で\n三沢が会見を開きます。"}, {"t": 417.51666666666665, "x": "新しい団体の設立を発表する席でした。"}, {"t": 420.65, "x": "三沢はこう話しました。"}, {"t": 422.35, "x": "全日本プロレスが持つ伝統と、\n私がこれからやろうとする"}, {"t": 426.4, "x": "プロレスの間にギャップを感じ。"}, {"t": 428.25, "x": "退団した選手は24人です。"}, {"t": 430.56666666666666, "x": "週刊プロレスの記録でした。"}, {"t": 432.51666666666665, "x": "ほかに練習生が1人続きました。"}, {"t": 434.8333333333333, "x": "レフェリーとリングアナウンサーも\n6人続きました。"}, {"t": 437.8, "x": "東京スポーツのカメラマンは、1990年の\n離脱とは比べものにならないと書きました。"}, {"t": 443.8666666666667, "x": "そして6月19日です。"}, {"t": 445.76666666666665, "x": "川田と渕が道場で会見を開きました。"}, {"t": 448.6, "x": "同じ日に日本テレビが打ち切りを発表しました。"}, {"t": 451.6166666666667, "x": "川田の言葉が残っています。"}, {"t": 453.6166666666667, "x": "僕の使命は馬場さんの築いた全日本プロレスを\n守ることだと思っています。"}, {"t": 458.31666666666666, "x": "会見ではもう1つ新しい動きが出ました。"}, {"t": 461.31666666666666, "x": "川田と渕が、新日本プロレスとの\n交流を宣言したのです。"}, {"t": 465.68333333333334, "x": "三沢はこの日に日本テレビの\n担当者と会っています。"}, {"t": 468.93333333333334, "x": "新しい団体のためです。"}, {"t": 470.78333333333336, "x": "枠を確保したという記事でした。"}, {"t": 472.81666666666666, "x": "伝えたのはスラム・レスリングでした。"}, {"t": 474.98333333333335, "x": "同じ記事には全日本の関係者の\n悲観の声も載りました。"}, {"t": 478.6333333333333, "x": "中継を失えば、団体は終わりだという見方です。"}, {"t": 482.35, "x": "7月23日の日本武道館が、\n最後の興行になるとまで書かれています。"}, {"t": 487.8833333333333, "x": "では、日本テレビの中で何が\n検討されたのでしょうか？"}, {"t": 491.9166666666667, "x": "社内の判断の過程は、\n確認できた資料の中にはありません。"}, {"t": 496.31666666666666, "x": "海外の報道には手がかりが1つあります。"}, {"t": 499.1, "x": "三沢は早い時期から、日本テレビに\n退団の考えを伝えていたという内容です。"}, {"t": 504.35, "x": "日本テレビは協力を約束しました。"}, {"t": 506.88 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
